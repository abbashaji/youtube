name: Universal Video Archiver to Backblaze B2

on:
  workflow_dispatch:
    inputs:
      target_urls:
        description: 'Video/Playlist/Channel URLs (One URL per line)'
        required: true
        type: string
        default: |
          https://www.youtube.com/watch?v=OiJ5jvi4WzU
          https://www.youtube.com/watch?v=EpumXux_HpE

      quality:
        description: 'Select Video / Audio Quality'
        required: true
        type: choice
        default: '1080p'
        options:
          - '4k_best'
          - '1080p'
          - '720p'
          - '480p'
          - 'audio_only_mp3'
          - 'audio_only_best'

      max_downloads:
        description: 'Max items to download this run (leave blank or 0 for unlimited)'
        required: false
        type: string
        default: '25'

jobs:
  archive-to-b2:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (FFmpeg, aria2, rclone, Deno)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 rclone
          # Install latest Deno runtime for YouTube JS challenges
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          pip install --upgrade yt-dlp

      - name: Configure rclone for Backblaze B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [b2]
          type = b2
          account = ${B2_KEY_ID}
          key = ${B2_APP_KEY}
          hard_delete = true
          EOF

      - name: Download & Upload Stream to B2
        env:
          RAW_URLS: ${{ inputs.target_urls }}
          QUALITY: ${{ inputs.quality }}
          MAX_DOWNLOADS: ${{ inputs.max_downloads }}
          BUCKET: ${{ secrets.B2_BUCKET_NAME }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          touch archive.txt
          mkdir -p downloads

          # 1. Parse and sanitize input URLs into links.txt
          printf "%s\n" "$RAW_URLS" | sed '/^[[:space:]]*$/d' > links.txt
          echo "[*] Queued URLs for download:"
          cat links.txt

          # 2. Check if any YouTube URL is present in the list
          SITE_SPECIFIC_ARGS=()
          if grep -Eq 'youtube\.com|youtu\.be' links.txt; then
            echo "[*] YouTube URL detected in batch. Applying YouTube challenge solvers & cookies."
            if [ -n "$YT_COOKIES" ]; then
              printf "%s\n" "$YT_COOKIES" > cookies.txt
              SITE_SPECIFIC_ARGS+=(--cookies cookies.txt)
            fi
            SITE_SPECIFIC_ARGS+=(--remote-components ejs:github)
            SITE_SPECIFIC_ARGS+=(--extractor-args "youtube:player_client=web,tv")
          fi

          # 3. Format Selectors
          EXTRA_FLAGS=()
          OUTPUT_PATH="downloads/%(extractor)s/%(uploader,channel|Unknown)s/%(upload_date>%Y-%m-%d)s - %(title)s [%(id)s].%(ext)s"

          case "$QUALITY" in
            4k_best)
              FORMAT_ARGS=(-f "bv*+ba/b" --merge-output-format mp4)
              ;;
            1080p)
              FORMAT_ARGS=(-f "bv*[height<=1080]+ba/b[height<=1080]/best" --merge-output-format mp4)
              ;;
            720p)
              FORMAT_ARGS=(-f "bv*[height<=720]+ba/b[height<=720]/best" --merge-output-format mp4)
              ;;
            480p)
              FORMAT_ARGS=(-f "bv*[height<=480]+ba/b[height<=480]/best" --merge-output-format mp4)
              ;;
            audio_only_mp3)
              FORMAT_ARGS=(-x --audio-format mp3 --audio-quality 0 --embed-thumbnail --add-metadata)
              ;;
            audio_only_best)
              FORMAT_ARGS=(-x --audio-format best --audio-quality 0 --embed-thumbnail --add-metadata)
              ;;
          esac

          if [ -n "$MAX_DOWNLOADS" ] && [ "$MAX_DOWNLOADS" != "0" ]; then
            EXTRA_FLAGS+=(--max-downloads "$MAX_DOWNLOADS")
          fi

          # 4. Run yt-dlp using --batch-file (-a)
          yt-dlp \
            "${FORMAT_ARGS[@]}" \
            "${EXTRA_FLAGS[@]}" \
            "${SITE_SPECIFIC_ARGS[@]}" \
            --download-archive "archive.txt" \
            --output "$OUTPUT_PATH" \
            --external-downloader aria2c \
            --external-downloader-args "aria2c:-x 16 -s 16 -k 1M" \
            --sleep-interval 1 \
            --max-sleep-interval 4 \
            --ignore-errors \
            --exec "rclone move %(filepath)q b2:${BUCKET}/%(extractor)q/%(uploader,channel|Unknown)q/ --delete-empty-src-dirs" \
            -a links.txt

          # Clean up temporary files
          rm -f cookies.txt links.txt

      - name: Commit and Push Updated archive.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add archive.txt
          if git diff --staged --quiet; then
            echo "No changes to archive.txt"
          else
            git commit -m "Update download archive [skip ci]"
            git push
          fi
