name: Archive YouTube to Backblaze B2

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'YouTube URL (Single Video, Playlist, or Channel @user/videos)'
        required: true
        type: string
        default: 'https://www.youtube.com/watch?v=EpumXux_HpE'

      quality:
        description: 'Select Video / Audio Quality'
        required: true
        type: choice
        default: '1080p'
        options:
          - '4k_best'
          - '1080p'
          - '720p'
          - '480p'
          - 'audio_only_mp3'
          - 'audio_only_best'

      max_downloads:
        description: 'Max items to download this run (leave blank or 0 for unlimited)'
        required: false
        type: string
        default: '25'

jobs:
  archive-to-b2:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (FFmpeg, aria2, rclone, Deno)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 rclone
          # Install Deno JS runtime for yt-dlp JavaScript challenge solver
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          pip install --upgrade yt-dlp

      - name: Configure rclone for Backblaze B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [b2]
          type = b2
          account = ${B2_KEY_ID}
          key = ${B2_APP_KEY}
          hard_delete = true
          EOF

      - name: Download & Upload Stream to B2
        env:
          TARGET_URL: ${{ inputs.target_url }}
          QUALITY: ${{ inputs.quality }}
          MAX_DOWNLOADS: ${{ inputs.max_downloads }}
          BUCKET: ${{ secrets.B2_BUCKET_NAME }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          touch archive.txt
          mkdir -p downloads

          # Save cookies to temporary file if secret is provided
          COOKIE_ARG=""
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          fi

          # Quality selections
          EXTRA_FLAGS=""
          OUTPUT_PATH="downloads/%(uploader,channel|Unknown)s/%(upload_date>%Y-%m-%d)s - %(title)s [%(id)s].%(ext)s"

          case "$QUALITY" in
            4k_best)
              FORMAT_FLAG='-f bestvideo+bestaudio/best --merge-output-format mp4'
              ;;
            1080p)
              FORMAT_FLAG='-f bestvideo[height<=1080]+bestaudio/best[height<=1080] --merge-output-format mp4'
              ;;
            720p)
              FORMAT_FLAG='-f bestvideo[height<=720]+bestaudio/best[height<=720] --merge-output-format mp4'
              ;;
            480p)
              FORMAT_FLAG='-f bestvideo[height<=480]+bestaudio/best[height<=480] --merge-output-format mp4'
              ;;
            audio_only_mp3)
              FORMAT_FLAG='-x --audio-format mp3 --audio-quality 0 --embed-thumbnail --add-metadata'
              ;;
            audio_only_best)
              FORMAT_FLAG='-x --audio-format best --audio-quality 0 --embed-thumbnail --add-metadata'
              ;;
          esac

          if [ -n "$MAX_DOWNLOADS" ] && [ "$MAX_DOWNLOADS" != "0" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --max-downloads $MAX_DOWNLOADS"
          fi

          echo "[*] Target URL: $TARGET_URL"

          # Run yt-dlp with iOS/Android client fallbacks and JS runtime
          yt-dlp \
            $FORMAT_FLAG \
            $EXTRA_FLAGS \
            $COOKIE_ARG \
            --extractor-args "youtube:player_client=ios,android,web" \
            --download-archive "archive.txt" \
            --output "$OUTPUT_PATH" \
            --external-downloader aria2c \
            --external-downloader-args "aria2c:-x 16 -s 16 -k 1M" \
            --sleep-interval 2 \
            --max-sleep-interval 6 \
            --ignore-errors \
            --exec "rclone copy {} b2:${BUCKET}/youtube/ && rm -f {}" \
            "$TARGET_URL"

          # Remove cookies file after job completes
          rm -f cookies.txt

      - name: Commit and Push Updated archive.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add archive.txt
          if git diff --staged --quiet; then
            echo "No changes to archive.txt"
          else
            git commit -m "Update download archive [skip ci]"
            git push
          fi
