name: Universal Video Archiver to Backblaze B2

on:
  workflow_dispatch:
    inputs:
      target_urls:
        description: 'Video/Playlist/Channel URLs (one per line or single URL)'
        required: true
        type: string
        default: 'https://www.youtube.com/watch?v=OiJ5jvi4WzU'

      quality:
        description: 'Select Video / Audio Quality'
        required: true
        type: choice
        default: '1080p'
        options:
          - '4k_best'
          - '1080p'
          - '720p'
          - '480p'
          - 'audio_only_mp3'
          - 'audio_only_best'

      max_downloads:
        description: 'Max items per target URL (leave blank or 0 for unlimited)'
        required: false
        type: string
        default: '25'

jobs:
  archive-to-b2:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (FFmpeg, aria2, rclone, Deno)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 rclone
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          pip install --upgrade yt-dlp

      - name: Configure rclone for Backblaze B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [b2]
          type = b2
          account = ${B2_KEY_ID}
          key = ${B2_APP_KEY}
          hard_delete = true
          EOF

      - name: Download & Upload Stream to B2
        env:
          RAW_URLS: ${{ inputs.target_urls }}
          QUALITY: ${{ inputs.quality }}
          MAX_DOWNLOADS: ${{ inputs.max_downloads }}
          BUCKET: ${{ secrets.B2_BUCKET_NAME }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          touch archive.txt
          mkdir -p downloads

          # 1. Parse and sanitize input URLs (strip carriage returns and blank lines)
          printf "%s\n" "$RAW_URLS" | tr -d '\r' | sed '/^[[:space:]]*$/d' > links.txt
          echo "[*] Total queued URLs: $(wc -l < links.txt)"

          # 2. Setup cookies if provided
          if [ -n "$YT_COOKIES" ]; then
            printf "%s\n" "$YT_COOKIES" > cookies.txt
          fi

          # 3. Format Selectors
          EXTRA_FLAGS=()
          OUTPUT_PATH="downloads/%(extractor)s/%(uploader,channel|Unknown)s/%(upload_date>%Y-%m-%d)s - %(title)s [%(id)s].%(ext)s"

          case "$QUALITY" in
            4k_best)
              FORMAT_ARGS=(-f "bv*+ba/b" --merge-output-format mp4)
              ;;
            1080p)
              FORMAT_ARGS=(-f "bv*[height<=1080]+ba/b[height<=1080]/best" --merge-output-format mp4)
              ;;
            720p)
              FORMAT_ARGS=(-f "bv*[height<=720]+ba/b[height<=720]/best" --merge-output-format mp4)
              ;;
            480p)
              FORMAT_ARGS=(-f "bv*[height<=480]+ba/b[height<=480]/best" --merge-output-format mp4)
              ;;
            audio_only_mp3)
              FORMAT_ARGS=(-x --audio-format mp3 --audio-quality 0 --embed-thumbnail --add-metadata)
              ;;
            audio_only_best)
              FORMAT_ARGS=(-x --audio-format best --audio-quality 0 --embed-thumbnail --add-metadata)
              ;;
          esac

          if [ -n "$MAX_DOWNLOADS" ] && [ "$MAX_DOWNLOADS" != "0" ]; then
            EXTRA_FLAGS+=(--max-downloads "$MAX_DOWNLOADS")
          fi

          # 4. Loop URL-by-URL so a 404/broken link never aborts the other URLs
          FAILED_COUNT=0
          SUCCESS_COUNT=0

          while IFS= read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^[[:space:]]*# ]] && continue

            echo "============================================================"
            echo "[*] Processing target: $url"
            echo "============================================================"

            CURRENT_SITE_ARGS=()
            if echo "$url" | grep -Eq 'youtube\.com|youtu\.be'; then
              [ -f cookies.txt ] && CURRENT_SITE_ARGS+=(--cookies cookies.txt)
              CURRENT_SITE_ARGS+=(--remote-components ejs:github)
              CURRENT_SITE_ARGS+=(--extractor-args "youtube:player_client=web,tv")
            fi

            if yt-dlp \
              "${FORMAT_ARGS[@]}" \
              "${EXTRA_FLAGS[@]}" \
              "${CURRENT_SITE_ARGS[@]}" \
              --download-archive "archive.txt" \
              --output "$OUTPUT_PATH" \
              --external-downloader aria2c \
              --external-downloader-args "aria2c:-x 16 -s 16 -k 1M" \
              --sleep-interval 1 \
              --max-sleep-interval 4 \
              --ignore-errors \
              --exec "rclone move %(filepath)q b2:${BUCKET}/%(extractor)q/%(uploader,channel|Unknown)q/ --delete-empty-src-dirs" \
              "$url"; then
                echo "[✓] Finished processing: $url"
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
                echo "::warning::Skipping bad/broken link (404/Private/Deleted): $url"
                FAILED_COUNT=$((FAILED_COUNT + 1))
            fi

          done < links.txt

          echo "============================================================"
          echo "[*] Batch summary: $SUCCESS_COUNT succeeded, $FAILED_COUNT failed/skipped."
          echo "============================================================"

          rm -f cookies.txt links.txt

      - name: Commit and Push Updated archive.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add archive.txt
          if git diff --staged --quiet; then
            echo "No changes to archive.txt"
          else
            git commit -m "Update download archive [skip ci]"
            git push
          fi
